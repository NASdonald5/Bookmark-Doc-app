<!DOCTYPE html>
<html>
<head>
    <title>Bookmark Pro</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --accent: #38bdf8;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; margin: 0; min-height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 250px; background: #1e293b; padding: 20px; border-right: 1px solid #334155; }
        .main-content { flex: 1; padding: 30px; }

        /* View Controls */
        .controls { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .view-btn { background: #334155; border: none; color: white; padding: 8px 12px; cursor: pointer; border-radius: 6px; }
        .view-btn.active { background: var(--accent); color: #000; }

        /* Grid System */
        .bookmark-grid { display: grid; gap: 20px; }
        .grid-view { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
        .list-view { grid-template-columns: 1fr; }

        /* Card Styling */
        .card { background: var(--card); border-radius: 12px; padding: 15px; border: 1px solid #334155; transition: 0.2s; position: relative; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .card img { width: 32px; height: 32px; border-radius: 6px; margin-bottom: 10px; }
        
        /* Tag Styling */
        .tag { background: #0ea5e9; color: white; font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-right: 5px; }
        
        input, button { background: #334155; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; }
        .add-form { display: grid; gap: 10px; margin-bottom: 30px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>📁 Categories</h2>
    <p style="font-size: 14px; color: #94a3b8;">Click search to filter by tag</p>
    <!-- You can dynamically list tags here in the next step -->
</div>

<div class="main-content">
    <div class="controls">
        <h1>My Library</h1>
        <div>
            <button class="view-btn active" onclick="setView('grid')">Large Icons</button>
            <button class="view-btn" onclick="setView('list')">Details List</button>
        </div>
    </div>

    <!-- Add Form -->
    <form class="add-form container-box" action="/add" method="post">
        <input type="text" name="title" placeholder="Name" required>
        <input type="url" name="url" placeholder="URL (https://...)" required>
        <input type="text" name="tags" placeholder="Tags (e.g. Work, News, Social)">
        <button type="submit" style="background: var(--accent); color: black; font-weight: bold;">Add Bookmark</button>
    </form>

    <!-- Content -->
    <div id="wrapper" class="bookmark-grid grid-view">
        {% for b in bookmarks %}
        <div class="card">
            <img src="https://google.com{{ b['url'] }}" alt="">
            <div>
                <a href="{{ b['url'] }}" target="_blank" style="display:block; font-weight: bold; margin-bottom: 5px;">{{ b['title'] }}</a>
                <div style="margin-top: 8px;">
                    {% for tag in b['tags'].split(',') %}
                        {% if tag %}<span class="tag">{{ tag.strip() }}</span>{% endif %}
                    {% endfor %}
                </div>
            </div>
            <a href="{{ url_for('delete', id=b['id']) }}" style="color: var(--danger); font-size: 12px; position: absolute; top: 10px; right: 10px;">×</a>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    function setView(mode) {
        const wrapper = document.getElementById('wrapper');
        const buttons = document.querySelectorAll('.view-btn');
        buttons.forEach(b => b.classList.remove('active'));
        
        if(mode === 'grid') {
            wrapper.className = 'bookmark-grid grid-view';
            event.target.classList.add('active');
        } else {
            wrapper.className = 'bookmark-grid list-view';
            event.target.classList.add('active');
        }
    }
</script>
</body>
</html>
