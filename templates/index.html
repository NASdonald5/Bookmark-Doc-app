<!DOCTYPE html>
<html>
<head>
    <title>Bookmark Pro</title>
    <style>
        :root {
            --bg: #0f172a; --sidebar: #1e293b; --card: #1e293b; 
            --text: #f1f5f9; --accent: #38bdf8; --danger: #ef4444;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; margin: 0; min-height: 100vh; }
        
        .sidebar { width: 260px; background: var(--sidebar); padding: 25px; border-right: 1px solid #334155; position: sticky; top: 0; height: 100vh; box-sizing: border-box; }
        .cat-link { display: block; padding: 10px; color: #94a3b8; text-decoration: none; border-radius: 8px; margin-bottom: 5px; }
        .cat-link:hover, .cat-link.active { background: #334155; color: var(--text); }

        .main-content { flex: 1; padding: 40px; max-width: 1200px; }
        .controls { display: flex; gap: 20px; margin-bottom: 30px; align-items: center; }
        
        .add-form { display: grid; grid-template-columns: 1fr 2fr 1fr auto; gap: 10px; margin-bottom: 30px; padding: 20px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        input, button { background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; }
        .btn-accent { background: var(--accent); color: #0f172a; border: none; font-weight: bold; cursor: pointer; }

        .bookmark-grid { display: grid; gap: 20px; }
        .grid-view { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
        .list-view { grid-template-columns: 1fr; }
        
        .card { background: var(--card); border-radius: 12px; padding: 18px; border: 1px solid #334155; position: relative; transition: 0.3s; }
        .card:hover { border-color: var(--accent); transform: translateY(-3px); }
        .card img { width: 32px; height: 32px; border-radius: 6px; margin-bottom: 10px; background: white; padding: 2px; }
        
        .tag { background: #334155; color: var(--accent); font-size: 10px; padding: 3px 10px; border-radius: 20px; margin-right: 5px; }
        .edit-btn { position: absolute; top: 15px; right: 40px; background: none; color: var(--accent); cursor: pointer; border: none; font-size: 14px; }

        .bulk-drawer { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #0f172a; padding: 20px; border-radius: 50px; display: none; z-index: 1000; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: var(--card); margin: 10% auto; padding: 30px; border-radius: 15px; width: 400px; border: 1px solid var(--accent); }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>📁 Library</h2>
    <a href="/" class="cat-link {% if not current_cat %}active{% endif %}">All Items</a>
    {% for cat in categories %}
        <a href="/?category={{ cat['category'] }}" class="cat-link {% if current_cat == cat['category'] %}active{% endif %}">{{ cat['category'] }}</a>
    {% endfor %}
</div>

<div class="main-content">
    <div class="controls">
        <form action="/" method="get" style="display:flex; flex:1; gap:10px;">
            <input type="text" name="q" placeholder="Search..." value="{{ search_query }}" style="width:100%;">
            <button type="submit" class="btn-accent">Search</button>
        </form>
        <button class="btn-accent" style="background:#475569; color:white;" onclick="toggleBulk()">Bulk Mode</button>
    </div>

    <form class="add-form" action="/add" method="post">
        <input type="text" name="title" placeholder="Name" required>
        <input type="url" name="url" placeholder="URL" required>
        <input type="text" name="category" placeholder="Category">
        <button type="submit" class="btn-accent">Add</button>
    </form>

    <form id="bulkForm" action="/bulk_update" method="post">
        <div id="bulkDrawer" class="bulk-drawer">
            <span id="selectedCount">0 Selected</span>
            <input type="text" name="new_category" placeholder="New Category">
            <button type="submit">Apply</button>
        </div>

        <div id="wrapper" class="bookmark-grid grid-view">
            {% for b in bookmarks %}
            <div class="card">
                <input type="checkbox" name="selected_ids" value="{{ b.id }}" class="bulk-ui" style="display:none;" onchange="updateCount()">
                <img src="https://google.com{{ b.url }}">
                <div style="font-size:11px; color:var(--accent);">{{ b.category }}</div>
                <a href="{{ b.url }}" target="_blank" style="color:white; text-decoration:none; font-weight:bold; display:block; margin:5px 0;">{{ b.title }}</a>
                {% for tag in (b.tags or '').split(',') %}{% if tag %}<span class="tag">{{ tag }}</span>{% endif %}{% endfor %}
                
                <button type="button" class="edit-btn" onclick="openEditModal('{{b.id}}','{{b.title}}','{{b.url}}','{{b.category}}','{{b.tags}}')">✎</button>
                <a href="/delete/{{b.id}}" style="position:absolute; top:15px; right:15px; color:var(--danger); text-decoration:none;">×</a>
            </div>
            {% endfor %}
        </div>
    </form>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>Edit Bookmark</h3>
        <form id="editForm" method="post">
            <input type="text" name="title" id="editTitle" required style="width:100%; margin-bottom:10px;">
            <input type="url" name="url" id="editUrl" required style="width:100%; margin-bottom:10px;">
            <input type="text" name="category" id="editCat" style="width:100%; margin-bottom:10px;">
            <input type="text" name="tags" id="editTags" style="width:100%; margin-bottom:20px;">
            <button type="submit" class="btn-accent">Save</button>
            <button type="button" onclick="closeModal()" style="background:#444;">Cancel</button>
        </form>
    </div>
</div>

<script>
    function toggleBulk() {
        const ui = document.querySelectorAll('.bulk-ui');
        const dr = document.getElementById('bulkDrawer');
        const show = ui[0].style.display === 'none';
        ui.forEach(c => c.style.display = show ? 'block' : 'none');
        dr.style.display = show ? 'flex' : 'none';
    }
    function updateCount() {
        document.getElementById('selectedCount').innerText = document.querySelectorAll('input[name="selected_ids"]:checked').length + " Selected";
    }
    function openEditModal(id, t, u, c, tg) {
        document.getElementById('editForm').action = '/edit/' + id;
        document.getElementById('editTitle').value = t; document.getElementById('editUrl').value = u;
        document.getElementById('editCat').value = c; document.getElementById('editTags').value = tg;
        document.getElementById('editModal').style.display = 'block';
    }
    function closeModal() { document.getElementById('editModal').style.display = 'none'; }
</script>
</body>
</html>
